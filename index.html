<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#fcfcfc"/>
<meta name="description" content="Viskir — simple, free workout tracking for iPhone."/>
<title>Viskir — Simple. Free.</title>
<style>
:root{--bg:#fcfcfc;--ink:#09090a;--accent:#ff3044;--muted:#797b80;--line:rgba(0,0,0,.085)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}.shell{width:min(calc(100% - 148px),1524px);margin-inline:auto}
header{height:95px;display:flex;align-items:center;position:relative;z-index:6}.brand{font-size:27px;font-weight:760;letter-spacing:-.065em;text-decoration:none}
.hero{position:relative;min-height:829px;display:flex;align-items:center;isolation:isolate}
.copy{position:relative;z-index:3;flex:none;width:57%;transform:translateY(-38px)}.eyebrow{font-size:19px;font-weight:500;letter-spacing:-.015em;margin:0 0 20px}
h1{margin:0;font-size:clamp(65px,6.4vw,108px);line-height:.98;font-weight:760;letter-spacing:-.072em;white-space:nowrap}
.actions{margin-top:42px;display:flex;gap:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 28px;min-height:60px;font-size:19px;font-weight:600;text-decoration:none;background:white;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 12px 29px rgba(255,48,68,.19)}.primary:hover{box-shadow:0 16px 35px rgba(255,48,68,.26)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.scene{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}.art{display:block;position:absolute;width:1510px;max-width:none;height:auto;right:calc((100% - 100vw)/2);top:-53px;user-select:none;/* fade only the EMPTY left border, never the tiger or phone edges */}
footer{min-height:110px;border-top:1px solid var(--line);position:relative;z-index:5;color:var(--muted)}.foot{min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:15px}.links{display:flex;gap:27px}.links a{text-decoration:none}.links a:hover{color:var(--ink)}
@media(min-width:1700px){.hero{min-height:calc(100svh - 205px)}.art{width:min(91vw,1640px);top:calc(50% - 390px)}}
@media(min-width:841px) and (max-width:1550px){.shell{width:calc(100% - 88px)}.hero{min-height:744px}.copy{width:56%}.eyebrow{font-size:17px}.art{width:clamp(950px,94vw,1510px);top:calc(50% - 399px);right:-38px}h1{font-size:clamp(65px,6.6vw,96px)}}
@media(max-width:840px){.shell{width:calc(100% - 40px)}header{height:78px}.brand{font-size:24px}.hero{min-height:0;display:block;padding:44px 0 0}.copy{width:100%;transform:none}.eyebrow{font-size:16px;margin-bottom:15px}h1{font-size:clamp(51px,10vw,78px)}.actions{margin-top:28px;gap:10px}.btn{min-height:50px;font-size:15px;padding:0 22px}.scene{position:relative;height:min(86vw,600px);margin:30px -20px 0;width:calc(100% + 40px);overflow:hidden}.art{width:min(150vw,902px);right:0;top:0}.foot,footer{min-height:74px}.foot{font-size:13px}.links{gap:17px}}
@media(max-width:500px){.scene{height:92vw;margin-top:24px}.art{width:161vw;right:-4vw;top:0}h1{font-size:clamp(48px,12.5vw,58px)}}
@media(max-width:360px){h1{font-size:46px}.btn{padding:0 18px}.art{width:167vw}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}

/* Responsive artwork bounds: retain the full approved tiger and phone. */
@media (min-width: 841px) and (max-width: 1550px) {
  .hero { min-height: max(744px, calc(58.224vw - 12px)); }
  .art { top: -35px; }
}
@media (min-width: 1551px) and (max-width: 1699px) {
  .hero { min-height: max(920px, calc(100svh - 205px)); }
  .art { top: -35px; }
}
@media (min-width: 1700px) {
  .hero { min-height: max(970px, min(1020px, calc(56.4vw + 10px)), calc(100svh - 205px)); }
  .art { top: -35px; }
}
@media (max-width: 840px) {
  .scene {
    position: relative;
    width: 100vw;
    height: calc(86.72vw + 8px);
    margin: 28px calc(50% - 50vw) 0;
    overflow: hidden;
  }
  .art {
    width: 140vw;
    height: auto;
    left: 50%;
    right: auto;
    top: 0;
    transform: translateX(-50%);
  }
}

/* Keep the complete scene visible on initial load in shorter desktop viewports. */
@media (min-width: 841px) and (max-height: 950px) {
  .art {
    width: min(calc(clamp(950px, 94vw, 1510px) - 90px), 175svh) !important;
    top: -145px !important;
    right: calc((100% - 100vw) / 2) !important;
  }
}
@media (min-width: 841px) and (max-height: 820px) {
  .art { top: -90px !important; }
}

/* Approved desktop slogan position: raised 50px beyond the last preview. */
@media (min-width: 841px) {
  .copy { transform: translateY(-176px); }
}
</style>
</head>
<body>
<header class="shell"><a class="brand" href="https://viskir.com/">Viskir</a></header>
<main><section class="shell hero" aria-label="Viskir workout tracking"><div class="copy">
<p class="eyebrow">Workout tracking for iPhone</p><h1>Simple. Free.</h1>
<nav class="actions" aria-label="Information"><a class="btn primary" href="https://viskir.com/support/">Support</a><a class="btn" href="https://viskir.com/privacy/">Privacy Policy</a></nav>
</div><div class="scene" aria-hidden="true"><img class="art" src="assets/viskir-tiger-corrected-mask-no-holes.webp" alt="" width="1595" height="986"/></div></section></main>
<footer><div class="shell foot"><span>© 2026 Viskir</span><nav class="links" aria-label="Footer"><a href="https://viskir.com/privacy/">Privacy</a><a href="https://viskir.com/support/">Support</a></nav></div></footer>
</body></html>
